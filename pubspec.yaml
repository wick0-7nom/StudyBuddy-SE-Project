name: study_buddy
description: Campus-focused study partner app for university students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3
  image_picker: ^1.1.2
  flutter_local_notifications: ^22.2.0
  firebase_messaging: ^16.4.1

  # 🟢 File Upload & Text Extraction
  file_picker: ^8.0.0
  http: ^1.6.0
  google_generative_ai: ^0.4.7
  syncfusion_flutter_pdf: ^34.2.4
  google_mlkit_text_recognition: ^0.13.0
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/images/app_logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/